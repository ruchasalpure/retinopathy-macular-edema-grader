spec_version: "0.1.0"
name: "retinopathy-macular-edema-grader"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Quantifies microaneurysms, intraretinal hemorrhages, and hard exudates in color fundus photographs according to the ETDRS severity scale"
capabilities:
  - "etdrs-severity-classification"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "etdrs-severity-classification"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
